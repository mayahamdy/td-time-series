<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CO2 time series lab — cleaning, smoothing, projection</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  .kpis { display: flex; gap: 1rem; flex-wrap: wrap; margin: 1rem 0; }
  .kpi { flex: 1; min-width: 160px; padding: 0.8rem 1rem; border: 1px solid #ccc; border-radius: 8px; }
  .kpi .value { font-size: 1.5rem; font-weight: bold; color: #0d7c9e; }
  .kpi .label { font-size: 0.8rem; color: #666; }
  #honesty { padding: 0.8rem 1rem; border: 2px solid #c46e0a; border-radius: 8px; background: #faf3e8; margin: 1rem 0; }
  canvas { margin-top: 1.5rem; }
  #updated { color: #666; font-size: 0.85rem; }
</style>
</head>
<body>
  <h1>CO2 time series lab</h1>
  <p>Real atmospheric CO2 (ppm) for Le Mans and Paris, from Open-Meteo's Air Quality API — raw values, a rolling mean, exponential smoothing, and a linear-trend projection.</p>
  <div class="kpis" id="kpis">Loading...</div>
  <div id="honesty"></div>
  <canvas id="seriesChart" height="320"></canvas>
  <p id="updated"></p>

<script>
fetch('data/series_analysis.json')
  .then(r => r.json())
  .then(data => {
    const locations = Object.entries(data.locations || {});
    if (locations.length === 0) {
      document.getElementById('kpis').innerHTML = '<p>No analysis yet -- run "Update analysis" from the Actions tab.</p>';
      return;
    }
    const unit = data.unit || '';

    const cityColors = {
      'Le Mans': ['#0d7c9e', '#2e8b46', '#8b2ea0', '#c46e0a'],
      'Paris': ['#c43d3d', '#a16b00', '#5865ad', '#a04478'],
    };
    const pointsByLocation = locations.map(([city, series]) => [city, [
      ...(series.raw || []),
      ...(series.projection || []),
    ]]);
    const allLabels = [...new Set(pointsByLocation.flatMap(([, points]) =>
      points.map(point => point.date)
    ))].sort();
    const dateIndex = Object.fromEntries(allLabels.map((date, index) => [date, index]));
    const datasets = [];
    const kpiHtml = [];
    const honestyHtml = [];

    for (const [city, series] of locations) {
      const colors = cityColors[city] || ['#0d7c9e', '#2e8b46', '#8b2ea0', '#c46e0a'];
      const gaps = series.gaps || [];
      const raw = series.raw || [];
      const projection = series.projection || [];
      const trend = series.trend_slope_per_day;

      kpiHtml.push(`
        <section>
          <h2>${city}</h2>
          <div class="kpis">
            <div class="kpi"><div class="value">${raw.length}</div><div class="label">Observed days</div></div>
            <div class="kpi"><div class="value">${gaps.length}</div><div class="label">Detected gap(s)</div></div>
            <div class="kpi"><div class="value">${trend >= 0 ? '+' : ''}${trend} ${unit}</div><div class="label">Trend per day</div></div>
            <div class="kpi"><div class="value">${raw[raw.length - 1]?.value ?? '—'} ${unit}</div><div class="label">Most recent reading</div></div>
          </div>
        </section>
      `);
      honestyHtml.push(`<p><strong>${city}:</strong> ${series.honest_note}</p>`);

      function valuesFor(points) {
        const values = Array(allLabels.length).fill(null);
        for (const point of points) values[dateIndex[point.date]] = point.value;
        return values;
      }

      [
        [`${city} observed`, raw, colors[0], 2, []],
        [`${city} rolling mean (7-day)`, series.rolling_mean || [], colors[1], 2, []],
        [`${city} exponential smoothing`, series.exp_smoothed || [], colors[2], 1, [2, 2]],
        [`${city} projection (low confidence)`, projection, colors[3], 2, [6, 4]],
      ].forEach(([label, points, color, width, dash]) => datasets.push({
        label,
        data: valuesFor(points),
        borderColor: color,
        backgroundColor: 'transparent',
        pointRadius: label.endsWith('observed') || label.includes('projection') ? 2 : 0,
        borderWidth: width,
        borderDash: dash,
      }));
    }

    document.getElementById('kpis').innerHTML = kpiHtml.join('');
    document.getElementById('honesty').innerHTML = honestyHtml.join('');

    new Chart(document.getElementById('seriesChart'), {
      type: 'line',
      data: { labels: allLabels, datasets },
      options: {
        plugins: {
          title: { display: true, text: `Real atmospheric CO2 (${unit}) — Le Mans and Paris comparison` },
          tooltip: { mode: 'index', intersect: false },
        },
        scales: {
          x: { title: { display: true, text: 'Date' }, ticks: { maxTicksLimit: 12 } },
          y: { title: { display: true, text: `CO2 (${unit})` } },
        },
        interaction: { mode: 'nearest', axis: 'x', intersect: false },
      },
    });
    document.getElementById('updated').textContent =
      `Data last analyzed ${data.generated_at || '(no timestamp -- see script output)'}. Dashed lines show projections.`;
  })
  .catch(err => {
    document.getElementById('kpis').innerHTML = '<p>Could not load analysis (' + err + ').</p>';
  });
</script>
</body>
</html>
